# Render Blueprint — สร้าง web service + PostgreSQL และเชื่อมให้อัตโนมัติ
# วิธีใช้: Render Dashboard → New + → Blueprint → เลือก repo Poidon/SMR → Apply
# Render จะอ่านไฟล์นี้ สร้างทุกอย่างให้ และถาม ADMIN_KEY ให้คุณตั้งเอง
services:
  - type: web
    name: seminar-smr
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # ผูกกับฐานข้อมูลด้านล่างอัตโนมัติ ไม่ต้องคัดลอก URL เอง
      - key: DATABASE_URL
        fromDatabase:
          name: seminar-db
          property: connectionString
      # Render จะถามให้กรอกตอน deploy (รหัสผ่านเข้าหน้า /admin)
      - key: ADMIN_KEY
        sync: false
      # เปิดส่งอีเมล/SMS จริงภายหลัง ค่อยเพิ่ม env พวกนี้ในแท็บ Environment ได้:
      #   RESEND_API_KEY, EMAIL_FROM, PUBLIC_URL, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM

databases:
  - name: seminar-db
    plan: free
    region: singapore
    databaseName: survey
    user: survey_user

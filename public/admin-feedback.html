<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>หลังบ้าน - ผลแบบประเมินความพึงพอใจ</title>
  <style>
    :root { --brand: #4f46e5; --brand-dark: #4338ca; --bg: #f1f5f9; --card: #fff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --error: #dc2626; --gold: #d9a92e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI","Sarabun","Prompt",system-ui,sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .login { max-width: 380px; margin: 60px auto; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 2px 12px rgba(15,23,42,.08); }
    .login h1 { text-align: center; }
    .login input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; margin: 12px 0; }
    .login button, .btn { background: var(--brand); color: #fff; border: none; padding: 11px 18px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .login button { width: 100%; padding: 13px; }
    .btn:hover, .login button:hover { background: var(--brand-dark); }
    .btn.ghost { background: #fff; color: var(--brand); border: 1px solid var(--border); }
    .login .err { color: var(--error); font-size: 14px; text-align: center; min-height: 20px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .toolbar .spacer { flex: 1; }
    .count { background: var(--brand); color: #fff; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }

    .avg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .avg { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 2px 12px rgba(15,23,42,.05); }
    .avg .t { font-size: 13px; color: var(--muted); min-height: 34px; }
    .avg .v { font-size: 30px; font-weight: 800; color: var(--gold); margin-top: 6px; }
    .avg .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .avg .bar { height: 7px; background: #eef2f7; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .avg .bar > span { display: block; height: 100%; background: linear-gradient(90deg,#f6dc83,#d9a92e); }
    .avg.overall { border-color: var(--gold); background: #fffdf5; }

    .table-card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(15,23,42,.06); }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; white-space: nowrap; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #f8fafc; font-weight: 700; color: var(--brand-dark); }
    tr:hover td { background: #f8faff; }
    td.wrap-cell { white-space: normal; max-width: 280px; }
    .score { font-weight: 700; }
    .empty { text-align: center; padding: 50px; color: var(--muted); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div id="loginView" class="login">
    <h1>เข้าสู่ระบบหลังบ้าน</h1>
    <input type="password" id="key" placeholder="กรอกรหัสผ่าน" />
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">เข้าสู่ระบบ</button>
  </div>

  <div id="dataView" class="wrap" style="display:none">
    <h1>ผลแบบประเมินความพึงพอใจ</h1>
    <p class="sub">คะแนนเฉลี่ยและรายการตอบกลับทั้งหมด (ไม่ระบุตัวตน)</p>

    <div class="toolbar">
      <span class="count" id="count">0 ชุด</span>
      <div class="spacer"></div>
      <button class="btn ghost" id="regBtn">← ไปหน้าผู้ลงทะเบียน</button>
      <button class="btn ghost" id="refreshBtn">รีเฟรช</button>
      <button class="btn" id="exportBtn">ดาวน์โหลด CSV</button>
      <button class="btn ghost" id="logoutBtn">ออกจากระบบ</button>
    </div>

    <div class="avg-grid" id="avgGrid"></div>

    <div class="table-card">
      <div class="scroll">
        <table id="table">
          <thead>
            <tr id="thead"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">ยังไม่มีผู้ทำแบบประเมิน</div>
    </div>
  </div>

  <script>
    const ITEMS = [
      { key: 'content', label: 'เนื้อหา' },
      { key: 'speaker', label: 'วิทยากร' },
      { key: 'organization', label: 'การจัดงาน/สถานที่' },
      { key: 'benefit', label: 'ความรู้/ประโยชน์' },
      { key: 'overall', label: 'โดยรวม' },
    ];
    const $ = id => document.getElementById(id);
    let KEY = sessionStorage.getItem('adminKey') || '';
    let rows = [];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function login() {
      const k = $('key').value.trim(); if (!k) return;
      const res = await fetch('/api/feedback?key=' + encodeURIComponent(k));
      if (res.ok) { KEY = k; sessionStorage.setItem('adminKey', k); showData(); load(); }
      else $('loginErr').textContent = 'รหัสผ่านไม่ถูกต้อง';
    }
    function showData() { $('loginView').style.display = 'none'; $('dataView').style.display = 'block'; }
    function logout() { sessionStorage.removeItem('adminKey'); KEY = ''; location.reload(); }

    async function load() {
      const res = await fetch('/api/feedback?key=' + encodeURIComponent(KEY));
      if (!res.ok) { logout(); return; }
      rows = (await res.json()).data || [];
      render();
    }

    function render() {
      $('count').textContent = rows.length + ' ชุด';
      $('empty').style.display = rows.length ? 'none' : 'block';
      $('table').style.display = rows.length ? 'table' : 'none';

      // คะแนนเฉลี่ย
      $('avgGrid').innerHTML = ITEMS.map(it => {
        const vals = rows.map(r => r[it.key]).filter(v => typeof v === 'number');
        const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
        const pct = (avg / 5 * 100).toFixed(0);
        return `<div class="avg ${it.key === 'overall' ? 'overall' : ''}">
          <div class="t">${it.label}</div>
          <div class="v">${avg ? avg.toFixed(2) : '-'}<small> / 5</small></div>
          <div class="bar"><span style="width:${pct}%"></span></div>
        </div>`;
      }).join('');

      // หัวตาราง
      $('thead').innerHTML = '<th>#</th>' + ITEMS.map(it => `<th>${it.label}</th>`).join('') +
        '<th>ข้อเสนอแนะ</th><th>หัวข้อครั้งต่อไป</th><th>เวลา</th>';

      // แถวข้อมูล
      $('tbody').innerHTML = rows.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          ${ITEMS.map(it => `<td class="score">${r[it.key] ?? '-'}</td>`).join('')}
          <td class="wrap-cell">${esc(r.suggestions) || '<span class="muted">-</span>'}</td>
          <td class="wrap-cell">${esc(r.topics) || '<span class="muted">-</span>'}</td>
          <td class="muted">${new Date(r.createdAt).toLocaleString('th-TH')}</td>
        </tr>`).join('');
    }

    $('loginBtn').onclick = login;
    $('key').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('refreshBtn').onclick = load;
    $('exportBtn').onclick = () => { window.location = '/api/feedback.csv?key=' + encodeURIComponent(KEY); };
    $('logoutBtn').onclick = logout;
    $('regBtn').onclick = () => { location.href = '/admin'; };

    if (KEY) { showData(); load(); }
  </script>
</body>
</html>

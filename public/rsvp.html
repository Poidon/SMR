<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยันการเข้าร่วมงานสัมมนา</title>
  <style>
    :root {
      --gold: #e6c15a; --brand: #e6c15a; --brand-dark: #f6dc83;
      --bg: #08080a; --card: rgba(255,255,255,.045);
      --text: #ededf1; --muted: #99a1ad; --border: rgba(255,255,255,.17); --error: #f87171; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI","Sarabun","Prompt",system-ui,sans-serif; color: var(--text); line-height: 1.6;
      background:
        radial-gradient(1000px 500px at 50% -8%, rgba(230,193,90,.13), transparent 60%),
        radial-gradient(800px 460px at 90% 108%, rgba(230,193,90,.10), transparent 55%),
        #08080a;
      background-attachment: fixed; min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
    .hero {
      background: radial-gradient(circle at 82% 118%, rgba(230,193,90,.35), transparent 46%), #0b0b0d;
      color: #fff; border-radius: 18px; padding: 30px 26px; text-align: center; margin-bottom: 20px;
    }
    .hero h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
    .hero .gold { background: linear-gradient(180deg,#f6dc83,#c6981f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero .meta { margin-top: 12px; color: #cbd5e1; font-size: 14px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,.10); border-radius: 18px; padding: 26px 22px;
      box-shadow: 0 10px 34px rgba(0,0,0,.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    h2 { font-size: 19px; margin: 0 0 6px; color: var(--gold); }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
    .choices { display: flex; gap: 12px; margin-bottom: 16px; }
    .opt {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
      border: 2px solid var(--border); border-radius: 12px; padding: 18px 12px; font-size: 16px; font-weight: 600; transition: .15s;
      background: rgba(255,255,255,.02);
    }
    .opt:hover { border-color: var(--gold); background: rgba(230,193,90,.09); }
    .opt input { width: 20px; height: 20px; accent-color: var(--gold); }
    .opt.yes.sel { border-color: var(--ok); background: rgba(52,211,153,.14); color: #6ee7b7; }
    .opt.no.sel { border-color: var(--error); background: rgba(248,113,113,.14); color: #fca5a5; }
    label.q { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 11px; font-size: 15px; font-family: inherit; min-height: 90px; resize: vertical; background: rgba(255,255,255,.04); color: var(--text); }
    textarea::placeholder { color: #6b7280; }
    textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(230,193,90,.18); background: rgba(255,255,255,.06); }
    #reasonBox { display: none; margin-bottom: 16px; }
    #reasonBox.show { display: block; }
    button.submit { width: 100%; padding: 16px; font-size: 17px; font-weight: 800; color: #1a1400; background: linear-gradient(180deg,#f6dc83,#d9a92e); border: none; border-radius: 13px; cursor: pointer; margin-top: 6px; box-shadow: 0 10px 26px rgba(230,193,90,.28); }
    button.submit:hover { filter: brightness(1.06); }
    button.submit:disabled { opacity: .55; cursor: not-allowed; filter: none; }
    #msg { margin-top: 14px; padding: 12px 14px; border-radius: 11px; font-size: 14px; display: none; }
    #msg.show { display: block; }
    #msg.error { background: rgba(248,113,113,.12); color: #fca5a5; border: 1px solid rgba(248,113,113,.35); }
    .center { text-align: center; }
    .check { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(180deg,#6ee7b7,#10b981); color: #06251a; font-size: 38px; line-height: 70px; margin: 6px auto 14px; box-shadow: 0 10px 26px rgba(52,211,153,.3); }
    .check.no { background: linear-gradient(180deg,#c7ccd4,#8b93a1); color: #1a1400; box-shadow: none; }
    .loading, .invalid { text-align: center; color: var(--muted); padding: 30px 10px; }
    .note { margin-top: 16px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>THINK WITH <span class="gold">DATA</span><br><span class="gold">DECIDE</span> WITH AI</h1>
      <div class="meta">3 APRIL 2026 · 13:00 – 16:00<br>Siam University · Building 19, Hall Of Fame</div>
    </div>

    <div class="card" id="card">
      <div class="loading" id="loading">กำลังโหลด...</div>

      <div id="form" style="display:none">
        <h2>ยืนยันการเข้าร่วม</h2>
        <p class="sub" id="hello"></p>

        <label class="q">ท่านจะเข้าร่วมงานสัมมนานี้หรือไม่?</label>
        <div class="choices">
          <label class="opt yes" id="optYes"><input type="radio" name="att" value="yes" /> <span>มาเข้าร่วม</span></label>
          <label class="opt no" id="optNo"><input type="radio" name="att" value="no" /> <span>ไม่มา</span></label>
        </div>

        <div id="reasonBox">
          <label class="q" for="reason">เหตุผลที่ไม่สามารถเข้าร่วมได้</label>
          <textarea id="reason" placeholder="โปรดระบุเหตุผล (ถ้าสะดวก)"></textarea>
        </div>

        <button class="submit" id="submitBtn">ยืนยัน</button>
        <div id="msg"></div>
      </div>

      <div id="done" style="display:none"></div>
      <div class="invalid" id="invalid" style="display:none">ลิงก์ไม่ถูกต้องหรือหมดอายุ<br>กรุณาติดต่อผู้จัดงาน</div>
    </div>

    <p class="note">ระบบลงทะเบียนงานสัมมนา</p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token') || '';

    function show(el) { ['loading','form','done','invalid'].forEach(x => $(x).style.display = x === el ? 'block' : 'none'); }

    // เลือก มา/ไม่มา → ไฮไลต์ + เปิดช่องเหตุผลถ้าไม่มา
    document.querySelectorAll('input[name=att]').forEach(r => {
      r.addEventListener('change', () => {
        $('optYes').classList.toggle('sel', $('optYes').querySelector('input').checked);
        $('optNo').classList.toggle('sel', $('optNo').querySelector('input').checked);
        $('reasonBox').classList.toggle('show', r.value === 'no' && r.checked);
      });
    });

    async function load() {
      if (!token) { show('invalid'); return; }
      try {
        const res = await fetch('/api/rsvp?token=' + encodeURIComponent(token));
        const out = await res.json();
        if (!res.ok || !out.ok) { show('invalid'); return; }
        $('hello').textContent = 'เรียน คุณ' + out.fullName;
        // เติมสถานะเดิมถ้าเคยยืนยันไว้
        if (out.attendance === 'yes' || out.attendance === 'no') {
          const r = document.querySelector('input[name=att][value="' + out.attendance + '"]');
          if (r) { r.checked = true; r.dispatchEvent(new Event('change')); }
          if (out.attendance === 'no' && out.absenceReason) $('reason').value = out.absenceReason;
        }
        show('form');
      } catch { show('invalid'); }
    }

    $('submitBtn').addEventListener('click', async () => {
      const sel = document.querySelector('input[name=att]:checked');
      const msg = $('msg');
      if (!sel) { msg.textContent = 'กรุณาเลือกว่าจะเข้าร่วมหรือไม่'; msg.className = 'show error'; return; }
      const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      try {
        const res = await fetch('/api/rsvp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, attendance: sel.value, absenceReason: $('reason').value.trim() }),
        });
        const out = await res.json();
        if (res.ok && out.ok) {
          const yes = sel.value === 'yes';
          $('done').innerHTML =
            '<div class="center">' +
            '<div class="check' + (yes ? '' : ' no') + '">' + (yes ? '✓' : '–') + '</div>' +
            '<h2>' + (yes ? 'ขอบคุณสำหรับการยืนยัน!' : 'รับทราบแล้ว') + '</h2>' +
            '<p class="sub">' + (yes
              ? 'เราบันทึกว่าท่านจะเข้าร่วมงาน<br>แล้วพบกันในวันงานนะครับ/ค่ะ'
              : 'เราบันทึกว่าท่านไม่สะดวกเข้าร่วม<br>ขอบคุณที่แจ้งให้ทราบครับ/ค่ะ') + '</p>' +
            '</div>';
          show('done');
        } else {
          msg.textContent = out.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่'; msg.className = 'show error';
          btn.disabled = false; btn.textContent = 'ยืนยัน';
        }
      } catch {
        msg.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่'; msg.className = 'show error';
        btn.disabled = false; btn.textContent = 'ยืนยัน';
      }
    });

    load();
  </script>
</body>
</html>
